  <!-- ==================== CARD 1: BOT ARCHITECTURE ==================== -->
  <g>
    <!-- Main Card Body -->
    <rect x="10" y="10" width="410" height="175" rx="14" fill="url(#cardBg)" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Top Glowing Accent Bar -->
    <path d="M 24 10 L 406 10" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Icon Circle -->
    <circle cx="45" cy="48" r="20" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.5" />
    <text x="45" y="55" text-anchor="middle" font-size="20">🤖</text>

    <!-- Header Text -->
    <text x="75" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00F2FE" letter-spacing="1">AUTOMATION &amp; BOT DEV</text>
    <text x="75" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Bot Architecture &amp; Agents</text>

    <!-- Description -->
    <text x="25" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">Engineering async Telegram &amp; Discord bots that handle</text>
    <text x="25" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">high-throughput webhooks, media tasks, and stateful flows.</text>

