    <text x="63" y="148" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" fill="#00F2FE" text-anchor="middle">Python</text>

    <rect x="108" y="132" width="82" height="24" rx="6" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
    <text x="149" y="148" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" fill="#00F2FE" text-anchor="middle">AsyncIO</text>

    <rect x="197" y="132" width="98" height="24" rx="6" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
    <text x="246" y="148" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" fill="#00F2FE" text-anchor="middle">Telegram API</text>

